name: CI

on:
  push:
    branches:
      - '*'

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install
        run: |
          pip install -U pip wheel
          pip install -e .
          pip install -r dev-requirements.txt

